<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ProteinQuest</title>
    <meta
      name="description"
      content="Download ProteinQuest — scan meals, track protein, and evolve your dragon."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProteinQuest" />
    <meta property="og:url" content="https://proteinquest.app/" />
    <meta property="og:title" content="ProteinQuest" />
    <meta
      property="og:description"
      content="Download ProteinQuest — scan meals, track protein, and evolve your dragon."
    />
    <meta
      property="og:image"
      content="https://proteinquest.app/assets/share-preview.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://proteinquest.app/assets/share-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="675" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProteinQuest" />
    <meta
      name="twitter:description"
      content="Download ProteinQuest — scan meals, track protein, and evolve your dragon."
    />
    <meta
      name="twitter:image"
      content="https://proteinquest.app/assets/share-preview.png"
    />
    <meta name="theme-color" content="#0C0B10" />
    <link rel="canonical" href="https://proteinquest.app/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="landing">
      <header class="brand">
        <img src="/assets/icon.png" width="32" height="32" alt="" />
        <span>Protein<span class="brand-accent">Quest</span></span>
      </header>

      <section
        class="carousel"
        id="screenshot-carousel"
        aria-roledescription="carousel"
        aria-label="App screenshots"
        tabindex="0"
      >
        <div class="carousel__viewport">
          <button
            type="button"
            class="carousel__btn carousel__btn--prev"
            aria-label="Previous screenshot"
          >
            ‹
          </button>
          <div class="carousel__stage">
            <div class="carousel__track">
              <figure class="carousel__slide" aria-roledescription="slide">
                <img src="/assets/screenshots/ios-01.png" width="540" height="1170" alt="Today screen" />
              </figure>
              <figure class="carousel__slide" aria-roledescription="slide">
                <img src="/assets/screenshots/ios-02.png" width="540" height="1170" alt="Trends screen" />
              </figure>
              <figure class="carousel__slide" aria-roledescription="slide">
                <img src="/assets/screenshots/ios-03.png" width="540" height="1170" alt="Intro screen" />
              </figure>
              <figure class="carousel__slide" aria-roledescription="slide">
                <img src="/assets/screenshots/ios-04.png" width="540" height="1170" alt="Pro screen" />
              </figure>
              <figure class="carousel__slide" aria-roledescription="slide">
                <img src="/assets/screenshots/ios-05.png" width="540" height="1170" alt="Scan screen" />
              </figure>
            </div>
          </div>
          <button
            type="button"
            class="carousel__btn carousel__btn--next"
            aria-label="Next screenshot"
          >
            ›
          </button>
        </div>
        <div class="carousel__dots" role="tablist" aria-label="Choose screenshot"></div>
      </section>

      <div class="store-badges">
        <a
          class="store-badge store-badge--play"
          data-store="play"
          href="#"
          aria-label="Get it on Google Play"
        >
          <img
            src="/assets/badges/google-play.png"
            width="646"
            height="250"
            alt="Get it on Google Play"
          />
        </a>
        <a
          class="store-badge store-badge--ios"
          data-store="ios"
          href="#"
          aria-label="Download on the App Store"
        >
          <img
            src="/assets/badges/app-store.svg"
            width="120"
            height="40"
            alt="Download on the App Store"
          />
        </a>
      </div>

      <footer class="footer">
        <nav aria-label="Legal">
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
        </nav>
      </footer>
    </main>

    <script src="/main.js" defer></script>
  </body>
</html>
