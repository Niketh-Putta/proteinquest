<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ProteinQuest</title>
    <meta
      name="description"
      content="Scan meals, track your daily protein goal, and evolve your dragon."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProteinQuest" />
    <meta property="og:url" content="https://proteinquest.app/" />
    <meta property="og:title" content="ProteinQuest" />
    <meta
      property="og:description"
      content="Scan meals, track your daily protein goal, and evolve your dragon."
    />
    <meta
      property="og:image"
      content="https://proteinquest.app/assets/share-preview.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://proteinquest.app/assets/share-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="675" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:updated_time" content="2026-06-20T13:00:00Z" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProteinQuest" />
    <meta
      name="twitter:description"
      content="Scan meals, track your daily protein goal, and evolve your dragon."
    />
    <meta
      name="twitter:image"
      content="https://proteinquest.app/assets/share-preview.png"
    />
    <meta name="theme-color" content="#0C0B10" />
    <link rel="canonical" href="https://proteinquest.app/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="landing">
      <header class="brand">
        <img src="/assets/icon.png" width="28" height="28" alt="" />
        <span>ProteinQuest</span>
      </header>

      <div class="body">
        <section class="hero">
          <h1>Track protein.<br />Grow your dragon.</h1>
          <p class="lead">
            Snap a meal, hit your protein goal, and evolve your companion, powered by AI.
          </p>

          <div class="store-badges">
            <a
              class="store-badge store-badge--play"
              data-store="play"
              href="#"
              aria-label="Get it on Google Play"
            >
              <img
                src="/assets/badges/google-play.png"
                width="646"
                height="250"
                alt="Get it on Google Play"
              />
            </a>
            <a
              class="store-badge store-badge--ios"
              data-store="ios"
              href="#"
              aria-label="Download on the App Store"
            >
              <img
                src="/assets/badges/app-store.svg"
                width="120"
                height="40"
                alt="Download on the App Store"
              />
            </a>
          </div>
        </section>

        <figure class="preview">
          <img
            class="preview__hero"
            src="/assets/hero-promo.jpg"
            width="576"
            height="1024"
            alt="ProteinQuest app showing daily protein goal with Ember the baby fire dragon"
            loading="eager"
          />
        </figure>
      </div>

      <footer class="footer">
        <nav aria-label="Legal">
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="mailto:niketh13putta@gmail.com">Contact</a>
        </nav>
        <p>© 2026 ProteinQuest</p>
      </footer>
    </main>

    <script src="/main.js" defer></script>
  </body>
</html>
