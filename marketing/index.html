<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ProteinQuest</title>
    <meta
      name="description"
      content="Scan meals, track your daily protein goal, and evolve your dragon."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://proteinquest.vercel.app/" />
    <meta property="og:title" content="ProteinQuest" />
    <meta
      property="og:description"
      content="Scan meals, track your daily protein goal, and evolve your dragon."
    />
    <meta property="og:image" content="https://proteinquest.vercel.app/assets/og-image.png" />
    <meta name="theme-color" content="#0C0B10" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="landing">
      <header class="brand">
        <img src="/assets/icon.png" width="28" height="28" alt="" />
        <span>ProteinQuest</span>
      </header>

      <div class="body">
        <section class="hero">
          <h1>Track protein.<br />Grow your dragon.</h1>
          <p class="lead">
            Snap a meal, hit your protein goal, and evolve your companion — powered by AI.
          </p>

          <div class="store-badges">
            <a
              class="store-badge store-badge--play"
              data-store="play"
              href="#"
              aria-label="Get it on Google Play"
            >
              <img
                src="/assets/badges/google-play.png"
                width="646"
                height="250"
                alt="Get it on Google Play"
              />
            </a>
            <span class="store-badge store-badge--soon" aria-label="App Store — coming soon">
              <img
                src="/assets/badges/app-store.svg"
                width="250"
                height="83"
                alt="Download on the App Store"
              />
              <span class="store-badge__soon">Coming soon</span>
            </span>
          </div>
        </section>

        <figure class="preview">
          <div class="preview__device">
            <img
              src="/assets/app-today.png"
              width="390"
              height="844"
              alt="ProteinQuest daily protein tracking with dragon companion"
              loading="eager"
            />
          </div>
        </figure>
      </div>

      <footer class="footer">
        <nav aria-label="Legal">
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
        </nav>
        <p>© 2026 ProteinQuest</p>
      </footer>
    </main>

    <script src="/main.js" defer></script>
  </body>
</html>
