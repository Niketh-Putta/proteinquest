<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProteinQuest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #1a1510 0%, #08080a 70%);
      font-family: system-ui, -apple-system, sans-serif;
      color: #f5f0e8;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 320px;
    }
    .logo {
      font-size: 11px;
      letter-spacing: 0.35em;
      color: #c9a86c;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.95rem;
      color: #9a958c;
      line-height: 1.5;
    }
    .url {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: #6b665e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PROTEINQUEST</div>
    <h1>Track protein.<br />Grow your dragon.</h1>
    <p>Gamified protein tracking — snap meals, hit your goal, evolve five forms.</p>
    <div class="url">proteinquest.vercel.app</div>
  </div>
</body>
</html>
