<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; }
    svg { display: block; }
  </style>
</head>
<body>
  <!--
    ProteinQuest icon: dragon eye inside coral protein ring.
    data-variant: full | foreground | splash
  -->
  <svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="42%" r="55%">
        <stop offset="0%" stop-color="#1A1520" />
        <stop offset="100%" stop-color="#0C0B10" />
      </radialGradient>
      <radialGradient id="irisGrad" cx="45%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#FF9B82" />
        <stop offset="55%" stop-color="#FF7A59" />
        <stop offset="100%" stop-color="#C44E35" />
      </radialGradient>
      <radialGradient id="eyeShine" cx="35%" cy="30%" r="40%">
        <stop offset="0%" stop-color="#FFF9F7" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#FFF9F7" stop-opacity="0" />
      </radialGradient>
      <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="12" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <clipPath id="eyeClip">
        <ellipse cx="512" cy="512" rx="148" ry="108" transform="rotate(-8 512 512)" />
      </clipPath>
    </defs>

    <rect id="bg" width="1024" height="1024" fill="url(#bgGlow)" />

    <!-- Outer ring track -->
    <circle cx="512" cy="512" r="340" fill="none" stroke="#22202C" stroke-width="14" />

    <!-- Protein progress arc (~72%) -->
    <circle
      cx="512" cy="512" r="340"
      fill="none"
      stroke="#FF7A59"
      stroke-width="14"
      stroke-linecap="round"
      stroke-dasharray="1535 2138"
      transform="rotate(-90 512 512)"
      filter="url(#ringGlow)"
      opacity="0.95"
    />

    <!-- Secondary violet accent tick at goal position -->
    <circle cx="512" cy="172" r="10" fill="#9B8CFF" opacity="0.85" />

    <!-- Scale arc hints (dragon motif) -->
    <g opacity="0.35" stroke="#36344A" stroke-width="3" fill="none">
      <path d="M 280 420 Q 320 380 360 400" />
      <path d="M 664 400 Q 704 380 744 420" />
      <path d="M 260 560 Q 300 540 340 560" />
      <path d="M 684 560 Q 724 540 764 560" />
    </g>

    <!-- Eye socket shadow -->
    <ellipse
      cx="512" cy="518" rx="168" ry="122"
      fill="#12111A"
      transform="rotate(-8 512 518)"
    />

    <!-- Eye white / sclera -->
    <ellipse
      cx="512" cy="512" rx="152" ry="112"
      fill="#18171F"
      stroke="#2A2835"
      stroke-width="4"
      transform="rotate(-8 512 512)"
    />

    <!-- Iris -->
    <g clip-path="url(#eyeClip)">
      <ellipse
        cx="512" cy="512" rx="148" ry="108"
        fill="url(#irisGrad)"
        transform="rotate(-8 512 512)"
      />
      <!-- Vertical slit pupil (dragon) -->
      <ellipse cx="512" cy="512" rx="18" ry="72" fill="#0C0B10" />
      <ellipse cx="512" cy="512" rx="8" ry="58" fill="#050408" />
      <!-- Iris texture rings -->
      <ellipse cx="512" cy="512" rx="90" ry="65" fill="none" stroke="#E85F42" stroke-width="2" opacity="0.4" transform="rotate(-8 512 512)" />
      <ellipse cx="512" cy="512" rx="55" ry="40" fill="none" stroke="#FF9B82" stroke-width="1.5" opacity="0.35" transform="rotate(-8 512 512)" />
    </g>

    <!-- Eye highlight -->
    <ellipse cx="468" cy="478" rx="28" ry="20" fill="url(#eyeShine)" transform="rotate(-15 468 478)" />

    <!-- Subtle inner ring echo -->
    <circle cx="512" cy="512" r="200" fill="none" stroke="#2A2835" stroke-width="2" opacity="0.5" />
  </svg>

  <script>
    const params = new URLSearchParams(location.search);
    const variant = params.get('variant') || 'full';
    const bg = document.getElementById('bg');
    if (variant === 'foreground' || variant === 'splash') {
      bg.setAttribute('fill', 'transparent');
      bg.removeAttribute('fill');
      bg.style.display = 'none';
    }
  </script>
</body>
</html>
