name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: prj_rTOSsuDcEPLN4UlIGo0OFuzvCJCt
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_STRIPE_ENABLED: ${{ secrets.EXPO_PUBLIC_STRIPE_ENABLED }}
      EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build marketing site
        run: node scripts/prepare-vercel-output.mjs

      - name: Deploy marketing site to Vercel production
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx vercel deploy --prod --yes --prebuilt --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects | tail -n 1)"
          npx vercel alias set "$DEPLOY_URL" proteinquest.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          npx vercel alias set "$DEPLOY_URL" www.proteinquest.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          npx vercel alias set "$DEPLOY_URL" proteinquest.vercel.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          npx vercel alias set "$DEPLOY_URL" proteinlens.vercel.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          echo "Marketing: https://proteinquest.app"

      - name: Build web app (Expo export)
        run: |
          npx expo export --platform web
          node scripts/prepare-web-export.mjs

      - name: Deploy web app to app.proteinquest.app
        run: |
          set -euo pipefail
          APP_DEPLOY_URL="$(npx vercel deploy dist --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects | tail -n 1)"
          npx vercel alias set "$APP_DEPLOY_URL" app.proteinquest.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          npx vercel alias set "$APP_DEPLOY_URL" app.proteinquest.vercel.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          echo "Web app: https://app.proteinquest.app"
