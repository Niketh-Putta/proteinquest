name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_RHLmvpeNG6AR3YddwMwPy6mq
      VERCEL_PROJECT_ID: prj_rTOSsuDcEPLN4UlIGo0OFuzvCJCt
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_STRIPE_ENABLED: ${{ secrets.EXPO_PUBLIC_STRIPE_ENABLED }}
      EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Vercel project env vars
        run: |
          set -euo pipefail
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx vercel env rm "$name" production --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || true
              printf '%s' "$val" | npx vercel env add "$name" production --token "${{ secrets.VERCEL_TOKEN }}"
            fi
          done

      - name: Build marketing site
        run: node scripts/prepare-vercel-output.mjs

      - name: Build web app (Expo export)
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "::error::Missing EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_KEY" || (echo "::error::Missing EXPO_PUBLIC_SUPABASE_KEY" && exit 1)
          npx expo export --platform web
          node scripts/prepare-web-export.mjs

      - name: Deploy web app to app.proteinquest.app
        id: app_deploy
        run: |
          set -euo pipefail
          cd dist
          APP_DEPLOY_URL="$(npx vercel deploy --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | tail -n 1)"
          if [ -z "$APP_DEPLOY_URL" ]; then
            echo "::error::Could not parse web app deploy URL"
            exit 1
          fi
          for domain in app.proteinquest.app app.proteinquest.vercel.app; do
            npx vercel alias set "$APP_DEPLOY_URL" "$domain" --token "${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || \
            npx vercel alias set "$APP_DEPLOY_URL" "$domain" --token "${{ secrets.VERCEL_TOKEN }}" || true
          done
          echo "app_url=$APP_DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Web app: https://app.proteinquest.app ($APP_DEPLOY_URL)"

      - name: Deploy marketing site to proteinquest.app (must be last)
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx vercel deploy --prod --yes --prebuilt --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | tail -n 1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not parse marketing deploy URL"
            exit 1
          fi
          for domain in proteinquest.app www.proteinquest.app proteinquest.vercel.app proteinlens.vercel.app; do
            npx vercel alias set "$DEPLOY_URL" "$domain" --token "${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || \
            npx vercel alias set "$DEPLOY_URL" "$domain" --token "${{ secrets.VERCEL_TOKEN }}" || true
          done
          echo "Marketing: https://proteinquest.app ($DEPLOY_URL)"
