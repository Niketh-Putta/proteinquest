name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: prj_rTOSsuDcEPLN4UlIGo0OFuzvCJCt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build marketing site
        run: node scripts/prepare-vercel-output.mjs

      - name: Deploy to Vercel production
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx vercel deploy --prod --yes --prebuilt --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects | tail -n 1)"
          npx vercel alias set "$DEPLOY_URL" proteinquest.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          npx vercel alias set "$DEPLOY_URL" www.proteinquest.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          npx vercel alias set "$DEPLOY_URL" proteinquest.vercel.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          npx vercel alias set "$DEPLOY_URL" proteinlens.vercel.app --token "${{ secrets.VERCEL_TOKEN }}" --scope niketh-puttas-projects
          echo "Production: https://proteinquest.app"
          echo "Production: https://proteinquest.vercel.app"
