name: Build and submit Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-production
  cancel-in-progress: true

# Retrigger after EXPO_TOKEN secret is configured in GitHub Actions.

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN. Add it at repo Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Configure Google Play service account
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret — submit step will be skipped."
            exit 0
          fi
          mkdir -p store
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > store/google-play-service-account.json

      - name: Build Android AAB (and auto-submit if Play creds present)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          if [ -f store/google-play-service-account.json ]; then
            echo "Google Play credentials present — building and submitting to production."
            npx eas-cli build --platform android --profile production --non-interactive --wait --auto-submit
          else
            echo "No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret — building only. Download the AAB from expo.dev and upload to Play Console manually."
            npx eas-cli build --platform android --profile production --non-interactive --wait
          fi
