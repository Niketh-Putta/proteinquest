# Uses GitHub secret EXPO_TOKEN (nikethputta1). Add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON for auto-submit.
name: Build and submit Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/download-eas-aab.mjs'
      - 'scripts/upload-aab-to-play.mjs'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-production
  cancel-in-progress: true

# Retrigger after GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is configured.

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN. Add it at repo Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Configure Google Play service account
        id: play_creds
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret — Play submit will be skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p store
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > store/google-play-service-account.json
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Google Play service account configured."

      - name: Sync EAS production env vars
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_REVENUECAT_IOS_KEY EXPO_PUBLIC_REVENUECAT_ANDROID_KEY; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              npx eas-cli env:create --name "$name" --value "$val" --environment production --visibility sensitive --force --non-interactive || true
            fi
          done

      - name: Configure Android signing key for Play
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing one or more Android keystore secrets"
            exit 1
          fi
          mkdir -p store
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > store/android-release.keystore
          node -e 'const fs=require("fs");const out={android:{keystore:{keystorePath:"./store/android-release.keystore",keystorePassword:process.env.ANDROID_KEYSTORE_PASSWORD,keyAlias:process.env.ANDROID_KEY_ALIAS,keyPassword:process.env.ANDROID_KEY_PASSWORD}}};fs.writeFileSync("credentials.json",JSON.stringify(out,null,2)+"\n");'

      - name: Build Android AAB on EAS cloud (avoids runner disk full)
        id: eas_build
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN"
            exit 1
          fi
          cp app.json app.json.bak
          cp eas.json eas.json.bak
          trap 'mv app.json.bak app.json; mv eas.json.bak eas.json' EXIT
          node -e 'const fs=require("fs");const p="eas.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.cli=j.cli||{};j.cli.appVersionSource="local";j.build=j.build||{};j.build.production=j.build.production||{};j.build.production.credentialsSource="local";fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n");'
          node -e 'const fs=require("fs");const p="app.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.expo=j.expo||{};j.expo.android=j.expo.android||{};j.expo.android.versionCode=Math.max(129,Number(j.expo.android.versionCode||0));fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n");'
          node scripts/patch-eas-project.mjs restore
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_REVENUECAT_IOS_KEY EXPO_PUBLIC_REVENUECAT_ANDROID_KEY; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              npx eas-cli env:create --name "$name" --value "$val" --environment production --visibility sensitive --force --non-interactive || true
            fi
          done
          npx eas-cli whoami
          npx eas-cli build --platform android --profile production --non-interactive --wait
          echo "build_id=latest" >> "$GITHUB_OUTPUT"
          trap - EXIT
          mv app.json.bak app.json
          mv eas.json.bak eas.json

      - name: Submit to Play production
        if: steps.play_creds.outputs.present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/patch-eas-project.mjs restore
          npx eas-cli submit --platform android --latest --profile production --non-interactive
          node scripts/patch-eas-project.mjs restore
