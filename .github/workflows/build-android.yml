# Uses GitHub secret EXPO_TOKEN (nikethputta1). Add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON for auto-submit.
name: Build and submit Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/upload-aab-to-play.mjs'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-production
  cancel-in-progress: true

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN. Add it at repo Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Configure Google Play service account
        id: play_creds
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret — Play submit will be skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p store
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > store/google-play-service-account.json
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Google Play service account configured."

      - name: Build Android AAB
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          set -euo pipefail
          mkdir -p store
          npx eas-cli build --platform android --profile production --non-interactive --wait --json > store/eas-build.json
          BUILD_ID="$(node -e "const j=require('./store/eas-build.json'); const b=Array.isArray(j)?j[0]:j; process.stdout.write(b?.id||'');")"
          if [ -z "$BUILD_ID" ]; then
            echo "::error::Could not parse EAS build id from JSON output."
            cat store/eas-build.json
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "EAS build id: $BUILD_ID"
          echo "Build page: https://expo.dev/accounts/nikethputta1/projects/proteinquest/builds/$BUILD_ID"

      - name: Download AAB from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx eas-cli build:download \
            --build-id "${{ steps.eas_build.outputs.build_id }}" \
            --non-interactive
          AAB="$(find . -maxdepth 2 -name '*.aab' -type f | head -1)"
          if [ -z "$AAB" ]; then
            echo "::error::Download finished but no .aab file found."
            exit 1
          fi
          cp "$AAB" store/proteinquest.aab
          ls -lh store/proteinquest.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: proteinquest-aab-${{ steps.eas_build.outputs.build_id }}
          path: store/proteinquest.aab
          retention-days: 30

      - name: Submit to Play production
        if: steps.play_creds.outputs.present == 'true'
        run: |
          node scripts/upload-aab-to-play.mjs --track=production || \
          npx eas-cli submit --platform android --profile production --path store/proteinquest.aab --non-interactive
