# Uses GitHub secret EXPO_TOKEN (nikethputta1). Add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON for auto-submit.
# mode=prices-only (or commit message [prices-only]) updates Play + App Store subscription regional prices.
name: Build and submit Android

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = AAB + Play upload; prices-only = update Play + App Store subscription prices'
        required: false
        default: 'build'
        type: choice
        options:
          - build
          - prices-only
  push:
    # Feature branch listed so a [prices-only] commit can apply store prices without merging.
    branches: [main, cursor/fix-play-gbp-prices-4928]
    paths:
      - 'src/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/download-eas-aab.mjs'
      - 'scripts/upload-aab-to-play.mjs'
      - 'scripts/play-set-subscription-prices.mjs'
      - 'scripts/asc-set-subscription-prices.mjs'
      - 'scripts/asc-api.mjs'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-production
  cancel-in-progress: true

# Retrigger after GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is configured.

jobs:
  build-and-submit:
    # On the temporary feature branch, only run for [prices-only] commits (avoid accidental AAB builds).
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prices-only]') }}
    runs-on: ubuntu-latest
    env:
      PRICES_ONLY: ${{ inputs.mode == 'prices-only' || contains(github.event.head_commit.message, '[prices-only]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: env.PRICES_ONLY != 'true'
        run: npm ci

      - name: Verify EXPO_TOKEN is configured
        if: env.PRICES_ONLY != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN. Add it at repo Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Configure Google Play service account
        id: play_creds
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret — Play submit/prices will be skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p store
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > store/google-play-service-account.json
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Google Play service account configured."

      - name: Configure App Store Connect API key
        if: env.PRICES_ONLY == 'true'
        id: asc
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_ASC_API_KEY_P8" ]; then
            echo "::error::APPLE_ASC_API_KEY_P8 missing — required for App Store price update"
            exit 1
          fi
          KEY_ID="$(node -e "const {normalizeKeyId}=require('./scripts/normalize-p8.cjs'); process.stdout.write(normalizeKeyId(process.env.APPLE_ASC_KEY_ID||'JZ3C87NKB9'));")"
          export KEY_ID
          mkdir -p store
          node -e "
            const fs=require('fs');
            const {normalizeP8}=require('./scripts/normalize-p8.cjs');
            const keyId=process.env.KEY_ID;
            const key=normalizeP8(process.env.APPLE_ASC_API_KEY_P8||'');
            if(!key) { console.error('APPLE_ASC_API_KEY_P8 empty'); process.exit(1); }
            fs.writeFileSync('store/AuthKey_'+keyId+'.p8', key);
          "
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "ASC key configured ($KEY_ID)."

      - name: Set Play + App Store subscription prices
        if: env.PRICES_ONLY == 'true'
        env:
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          ASC_KEY_PATH: ./store/AuthKey_${{ steps.asc.outputs.key_id }}.p8
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          EXPO_ASC_API_KEY_PATH: ./store/AuthKey_${{ steps.asc.outputs.key_id }}.p8
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ "${{ steps.play_creds.outputs.present }}" != "true" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON required for prices-only"
            exit 1
          fi
          export ASC_ISSUER_ID="${ASC_ISSUER_ID:-75ae36fa-911c-462c-818e-f1bcc4222c24}"
          export EXPO_ASC_ISSUER_ID="${EXPO_ASC_ISSUER_ID:-75ae36fa-911c-462c-818e-f1bcc4222c24}"
          ec=0
          echo "== Google Play =="
          node scripts/play-set-subscription-prices.mjs || ec=1
          echo "== App Store Connect =="
          node scripts/asc-set-subscription-prices.mjs || ec=1
          exit "$ec"

      - name: Sync EAS production env vars
        if: env.PRICES_ONLY != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_REVENUECAT_IOS_KEY EXPO_PUBLIC_REVENUECAT_ANDROID_KEY; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              npx eas-cli env:create --name "$name" --value "$val" --environment production --visibility sensitive --force --non-interactive || true
            fi
          done

      - name: Build Android AAB (local + Play upload key via nikethputta EAS project)
        if: env.PRICES_ONLY != 'true'
        id: eas_build
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_NIKETHPUTTA }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN_NIKETHPUTTA (nikethputta account with Play upload keystore Rr3MWJDvmn)"
            exit 1
          fi
          mkdir -p store
          node scripts/patch-eas-project.mjs play
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_REVENUECAT_IOS_KEY EXPO_PUBLIC_REVENUECAT_ANDROID_KEY; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              npx eas-cli env:create --name "$name" --value "$val" --environment production --visibility sensitive --force --non-interactive || true
            fi
          done
          npx eas-cli whoami
          npx eas-cli build --platform android --profile production --local --non-interactive --output store/proteinquest.aab
          node scripts/patch-eas-project.mjs restore
          ls -lh store/proteinquest.aab
          echo "build_id=play-signed-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        if: env.PRICES_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proteinquest-aab-${{ steps.eas_build.outputs.build_id }}
          path: store/proteinquest.aab
          retention-days: 30

      - name: Submit to Play production
        if: ${{ env.PRICES_ONLY != 'true' && steps.play_creds.outputs.present == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_NIKETHPUTTA }}
        run: |
          node scripts/upload-aab-to-play.mjs --track=production
