# Uses GitHub secret EXPO_TOKEN (nikethputta1). Add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON for auto-submit.
name: Build and submit Android

on:
  workflow_dispatch:
  push:
    # Feature branch so Play production can ship before merge (iOS left on main only).
    branches: [main, cursor/live-paywall-prices-4928]
    paths:
      - 'src/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/download-eas-aab.mjs'
      - 'scripts/upload-aab-to-play.mjs'
      - 'scripts/patch-eas-project.mjs'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-production
  cancel-in-progress: true

# Retrigger after GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is configured.

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo token for Play-signed build
        env:
          EXPO_TOKEN_NIKETHPUTTA: ${{ secrets.EXPO_TOKEN_NIKETHPUTTA }}
          EXPO_TOKEN_FALLBACK: ${{ secrets.EXPO_TOKEN }}
        run: |
          export EXPO_TOKEN="${EXPO_TOKEN_NIKETHPUTTA:-$EXPO_TOKEN_FALLBACK}"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN_NIKETHPUTTA (or EXPO_TOKEN). Needed for Play-signed Android build."
            exit 1
          fi
          npx eas-cli whoami

      - name: Configure Google Play service account
        id: play_creds
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret — Play submit will be skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p store
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > store/google-play-service-account.json
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Google Play service account configured."

      - name: Sync EAS production env vars
        env:
          EXPO_TOKEN_NIKETHPUTTA: ${{ secrets.EXPO_TOKEN_NIKETHPUTTA }}
          EXPO_TOKEN_FALLBACK: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          export EXPO_TOKEN="${EXPO_TOKEN_NIKETHPUTTA:-$EXPO_TOKEN_FALLBACK}"
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_REVENUECAT_IOS_KEY EXPO_PUBLIC_REVENUECAT_ANDROID_KEY; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              npx eas-cli env:create --name "$name" --value "$val" --environment production --visibility sensitive --force --non-interactive || true
            fi
          done

      - name: Free disk space (local AAB fills the runner)
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle /usr/local/share/boost /opt/ghc /usr/local/graalvm /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/Python || true
          sudo docker system prune -af || true
          # Keep only current Node; drop unused tool caches.
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/Ruby "$AGENT_TOOLSDIRECTORY"/Java_Temurin-Hotspot_jdk/8* || true
          df -h

      - name: Build Android AAB (EAS cloud + Play upload key via nikethputta)
        id: eas_build
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EXPO_TOKEN_NIKETHPUTTA: ${{ secrets.EXPO_TOKEN_NIKETHPUTTA }}
          EXPO_TOKEN_FALLBACK: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          set -euo pipefail
          export EXPO_TOKEN="${EXPO_TOKEN_NIKETHPUTTA:-$EXPO_TOKEN_FALLBACK}"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN_NIKETHPUTTA (nikethputta account with Play upload keystore)"
            exit 1
          fi
          mkdir -p store
          node scripts/patch-eas-project.mjs play
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_REVENUECAT_IOS_KEY EXPO_PUBLIC_REVENUECAT_ANDROID_KEY; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              npx eas-cli env:create --name "$name" --value "$val" --environment production --visibility sensitive --force --non-interactive || true
            fi
          done
          npx eas-cli whoami
          # Cloud build avoids GitHub runner "No space left on device" during packageReleaseBundle.
          npx eas-cli build --platform android --profile production --non-interactive --wait --json > store/eas-android.json
          BUILD_ID="$(node -e "const j=require('./store/eas-android.json'); const b=Array.isArray(j)?j[0]:j; if(!b?.id){console.error(JSON.stringify(j).slice(0,500)); process.exit(1)}; process.stdout.write(b.id);")"
          echo "EAS build id: $BUILD_ID"
          node scripts/download-eas-aab.mjs "$BUILD_ID" --out=store/proteinquest.aab
          node scripts/patch-eas-project.mjs restore
          ls -lh store/proteinquest.aab
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: proteinquest-aab-${{ steps.eas_build.outputs.build_id }}
          path: store/proteinquest.aab
          retention-days: 30

      - name: Submit to Play production
        if: steps.play_creds.outputs.present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_NIKETHPUTTA }}
        run: |
          node scripts/upload-aab-to-play.mjs --track=production
