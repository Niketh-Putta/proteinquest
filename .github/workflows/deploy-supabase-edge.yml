name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy payment + analysis edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT=csxdkvpvcasuknhnprxp
          for fn in analyze-food revenuecat-webhook; do
            echo "Deploying $fn…"
            supabase functions deploy "$fn" \
              --project-ref "$PROJECT" \
              --no-verify-jwt
          done
