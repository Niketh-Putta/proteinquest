# iOS App Store build + submit via GitHub EXPO_TOKEN + APPLE_ASC_API_KEY_P8.
# Local EAS build on macOS bypasses cloud quota on the free plan.
name: Build and submit iOS

on:
  workflow_dispatch:
    inputs:
      submit_only:
        description: 'Skip EAS build; only submit latest VALID ASC build for review'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: ios-production
  cancel-in-progress: true

jobs:
  build-and-submit:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # workflow_dispatch submit_only, or commit message tag to skip IPA rebuild
      SKIP_BUILD: ${{ inputs.submit_only == true || contains(github.event.head_commit.message, '[submit-only]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align Expo SDK packages
        if: env.SKIP_BUILD != 'true'
        run: npx expo install --fix

      - name: Select Xcode 26.4.1 (SDK 56 minimum)
        if: env.SKIP_BUILD != 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify EXPO_TOKEN is configured
        if: env.SKIP_BUILD != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN GitHub secret."
            exit 1
          fi
          npx eas-cli whoami

      # EXPO_TOKEN is nikethputta1; app.json must not point at inaccessible team projects.
      - name: Point EAS at accessible Expo project (nikethputta1)
        if: env.SKIP_BUILD != 'true'
        run: node scripts/patch-eas-project.mjs restore

      - name: Sync EAS production env vars
        if: env.SKIP_BUILD != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_REVENUECAT_IOS_KEY" ]; then
            echo "::error::Missing GitHub secret EXPO_PUBLIC_REVENUECAT_IOS_KEY (appl_… from RevenueCat). Run: node scripts/sync-revenuecat-keys.mjs"
            exit 1
          fi
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_REVENUECAT_IOS_KEY EXPO_PUBLIC_REVENUECAT_ANDROID_KEY; do
            val="${!name:-}"
            if [ -n "$val" ]; then
              npx eas-cli env:create --name "$name" --value "$val" --environment production --visibility sensitive --force --non-interactive || true
            fi
          done

      - name: Configure App Store Connect API key
        id: asc
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_ASC_API_KEY_P8" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::APPLE_ASC_API_KEY_P8 missing — required for iOS submit"
            exit 1
          fi
          KEY_ID="$(node -e "const {normalizeKeyId}=require('./scripts/normalize-p8.cjs'); process.stdout.write(normalizeKeyId(process.env.APPLE_ASC_KEY_ID||'JZ3C87NKB9'));")"
          export KEY_ID
          mkdir -p store
          node -e "
            const fs=require('fs');
            const {normalizeP8}=require('./scripts/normalize-p8.cjs');
            const keyId=process.env.KEY_ID;
            const key=normalizeP8(process.env.APPLE_ASC_API_KEY_P8||'');
            if(!key) { console.error('APPLE_ASC_API_KEY_P8 empty'); process.exit(1); }
            fs.writeFileSync('store/AuthKey_'+keyId+'.p8', key);
          "
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "Using ASC Key ID: $KEY_ID"

      - name: Sync ASC credentials into eas.json
        if: steps.asc.outputs.present == 'true' && env.SKIP_BUILD != 'true'
        env:
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          export KEY_ID="${{ steps.asc.outputs.key_id }}"
          export ISSUER_ID="${APPLE_ASC_ISSUER_ID:-75ae36fa-911c-462c-818e-f1bcc4222c24}"
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('eas.json','utf8'));
            const ios=j.submit.production.ios;
            ios.ascApiKeyId=process.env.KEY_ID;
            ios.ascApiKeyPath='./store/AuthKey_'+process.env.KEY_ID+'.p8';
            ios.ascApiKeyIssuerId=process.env.ISSUER_ID;
            if(!ios.ascApiKeyId||!ios.ascApiKeyPath||!ios.ascApiKeyIssuerId){
              console.error('eas.json submit config incomplete', ios);
              process.exit(1);
            }
            fs.writeFileSync('eas.json', JSON.stringify(j, null, 2)+'\n');
            console.log('eas.json submit ios: keyId='+ios.ascApiKeyId+', issuer='+ios.ascApiKeyIssuerId.slice(0,8)+'…');
          "

      - name: Validate ASC API key with Apple
        if: steps.asc.outputs.present == 'true'
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          EXPO_ASC_API_KEY_PATH: ./store/AuthKey_${{ steps.asc.outputs.key_id }}.p8
        run: node scripts/validate-asc-key.mjs

      - name: Validate iOS version > latest approved (ITMS-90062)
        if: steps.asc.outputs.present == 'true' && env.SKIP_BUILD != 'true'
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          EXPO_ASC_API_KEY_PATH: ./store/AuthKey_${{ steps.asc.outputs.key_id }}.p8
        run: node scripts/validate-ios-version.mjs --strict

      - name: Bootstrap iOS credentials on EAS
        id: ios_bootstrap
        if: steps.asc.outputs.present == 'true' && env.SKIP_BUILD != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          EXPO_ASC_API_KEY_PATH: ./store/AuthKey_${{ steps.asc.outputs.key_id }}.p8
          EXPO_APPLE_TEAM_ID: JU9C3N64F8
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
          EXPO_NO_KEYCHAIN: '1'
          NO_COLOR: '1'
        run: |
          export EXPO_ASC_ISSUER_ID="${APPLE_ASC_ISSUER_ID:-75ae36fa-911c-462c-818e-f1bcc4222c24}"
          node scripts/setup-expo-ios-credentials.cjs

      - name: Build iOS production (local)
        id: ios_build
        if: env.SKIP_BUILD != 'true'
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_GITHUB_ISSUES: '1'
          CI: '1'
          DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
        run: |
          set -euo pipefail
          mkdir -p store
          export KEY_ID="${{ steps.asc.outputs.key_id }}"
          node -e "
            const fs=require('fs');
            const {normalizeP8}=require('./scripts/normalize-p8.cjs');
            const key=normalizeP8(process.env.APPLE_ASC_API_KEY_P8||'');
            if(!key) { console.error('Missing APPLE_ASC_API_KEY_P8'); process.exit(1); }
            fs.writeFileSync('store/AuthKey_'+process.env.KEY_ID+'.p8', key);
          "
          rm -rf node_modules/expo-modules-jsi/apple/Products
          npx eas-cli build --platform ios --profile production --local --non-interactive --output store/ProteinQuest.ipa
          ls -lh store/ProteinQuest.ipa
          echo "ipa_built=true" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to App Store Connect
        if: steps.asc.outputs.present == 'true' && env.SKIP_BUILD != 'true' && steps.ios_build.outputs.ipa_built == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
        run: |
          set -euo pipefail
          export KEY_ID="${{ steps.asc.outputs.key_id }}"
          node -e "
            const fs=require('fs');
            const {normalizeP8}=require('./scripts/normalize-p8.cjs');
            const key=normalizeP8(process.env.APPLE_ASC_API_KEY_P8||'');
            fs.writeFileSync('store/AuthKey_'+process.env.KEY_ID+'.p8', key);
          "
          npx eas-cli submit --platform ios --profile production --path store/ProteinQuest.ipa --non-interactive

      - name: App Store status (before submit)
        if: steps.asc.outputs.present == 'true'
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          EXPO_ASC_API_KEY_PATH: ./store/AuthKey_${{ steps.asc.outputs.key_id }}.p8
        run: node scripts/check-ios-app-store-status.mjs || true

      - name: Submit for App Store review
        if: steps.asc.outputs.present == 'true'
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          EXPO_ASC_API_KEY_PATH: ./store/AuthKey_${{ steps.asc.outputs.key_id }}.p8
        run: |
          set -euo pipefail
          VERSION="$(node -e "console.log(require('./app.json').expo.version)")"
          echo "Submitting iOS $VERSION for App Store review…"
          for i in $(seq 1 45); do
            set +e
            OUT="$(node scripts/submit-ios-version.mjs --version="$VERSION" 2>&1)"
            CODE=$?
            set -e
            echo "$OUT"
            if [ "$CODE" -eq 0 ]; then
              exit 0
            fi
            if echo "$OUT" | grep -q "already in App Store state"; then
              exit 0
            fi
            if echo "$OUT" | grep -qE "No VALID build found|No VALID build for iOS|still PROCESSING|still UPLOADING"; then
              echo "Attempt $i/45 — ASC build still processing, retry in 20s…"
              sleep 20
              continue
            fi
            if echo "$OUT" | grep -qE "cannot be reviewed|ENTITY_STATE_INVALID|did not stick|UNRESOLVED_ISSUES|already present in"; then
              echo "Attempt $i/45 — clearing ASC review blockers, retry in 20s…"
              sleep 20
              continue
            fi
            echo "::error::Submit failed (non-retryable). Fix blockers in App Store Connect or listing metadata."
            exit 1
          done
          echo "::error::Timed out waiting for VALID ASC build for iOS $VERSION"
          exit 1

      - name: Upload App Store screenshots
        if: steps.asc.outputs.present == 'true'
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          EXPO_ASC_KEY_ID: ${{ steps.asc.outputs.key_id }}
          EXPO_ASC_API_KEY_PATH: ./store/AuthKey_${{ steps.asc.outputs.key_id }}.p8
        run: node scripts/asc-upload-screenshots.mjs || true

      - name: Summary
        if: always()
        run: |
          echo "## iOS App Store pipeline" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.ios_build.outputs.ipa_built }}" = "true" ]; then
            echo "Local IPA built and uploaded to App Store Connect." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.ios_build.outcome }}" = "skipped" ]; then
            echo "Submit-only run — skipped local build." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.ios_build.outcome }}" = "failure" ]; then
            echo "Local iOS build failed — see logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Check review status: App Store Connect → Apps → ProteinQuest → App Store → iOS App" >> "$GITHUB_STEP_SUMMARY"
